<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="app.css">
<script src="app-config.js"></script>
<!-- The version, generated into dist/ by scripts/stage.py from the VERSION file.
     Absent in an unstaged src/ tree, which changelog.js treats as "say nothing". -->
<script src="app-version.js"></script>
<!-- The corpus's branding, languages and string overlay (window.__SITE__),
     generated into dist/ by scripts/stage.py from corpus.toml. Before every
     module, because store.js and i18n.js read it at import. -->
<script src="site-config.js"></script>
<!-- Metrics and the development banner, both off unless the container
     environment turns them on. Deferred module: nothing here blocks the page. -->
<script type="module" src="site.js"></script>
<!-- The release-notes popup: opens by itself only for a reader who has been here
     before and whose last visit predates this version. -->
<script type="module" src="changelog.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./">{{brand}}<span>{{brand_em}}</span></a>
    <!-- The two ways into the corpus, both present on every page and always in
         this order, so the pair reads as a switch between two views rather than a
         link whose label changes under you. A reader who knows which document
         they want has no question to ask; a reader looking at the list may want
         to ask one after all. `aria-current="page"` marks the one you are on, and
         app.css hides it (a link to where you already are); the viewer is neither
         page, so there it marks nothing. -->
    <nav class="views" data-i18n-attr="aria-label:nav_label">
      <a class="plain nav" href="./" data-i18n="nav_search"></a>
      <a class="plain nav" href="browse.html" data-i18n="nav_browse"></a>
    </nav>
    <!-- The pages sit right after the wordmark and the spacer pushes the reader's
         settings to the far end, so the bar reads as "where am I" on the left and
         "how do I want it" on the right. -->
    <div class="spacer"></div>
    <!-- The reader's settings, as their own group: app.css spaces the controls
         inside a group tightly and the groups apart, so the bar reads as pages on
         one side and settings on the other. -->
    <div class="tools">
      <button class="plain" id="lang-btn"></button>
      <button class="plain" id="theme-btn" data-i18n-attr="aria-label:theme_toggle"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="viewer-bar">
    <a id="back" href="./" data-i18n="back_to_results"></a>
    <span class="spacer"></span>
    <!-- One control for the whole document, because "open it" and "save it" are two
         answers to the same question and two links side by side made the reader
         choose before knowing there was a choice. Empty here and filled by viewer.js
         from i18n.js's builder, which the result lists use too: the summary carries
         the document's page count, so it cannot exist before the index has loaded. -->
    <!-- Asking the same corpus a second question, from the document the first one
         landed in. The scope is the point: a reader who is reading THIS guideline
         usually wants the next answer from it too, and the two wider scopes are there
         because the same reader sometimes discovers that the answer is elsewhere.
         A <details>, like the PDF menu beside it, so both close by the same rule. -->
    <details class="doc-search" id="doc-search">
      <summary class="plain" data-i18n="search_here"></summary>
      <form class="doc-search-panel" id="doc-search-form">
        <input type="search" id="doc-q" autocomplete="off" maxlength="512"
               data-i18n-attr="placeholder:search_placeholder,aria-label:search_label">
        <fieldset>
          <legend data-i18n="search_scope"></legend>
          <label><input type="radio" name="scope" value="doc" checked>
                 <span data-i18n="scope_doc"></span></label>
          <!-- Written by viewer.js, since it names the issuer, and hidden outright on
               the documents that have none (a journal article has no issuing body). -->
          <label id="scope-issuer-row"><input type="radio" name="scope" value="issuer">
                 <span id="scope-issuer-label"></span></label>
          <label><input type="radio" name="scope" value="all">
                 <span data-i18n="scope_all"></span></label>
        </fieldset>
        <button class="plain" type="submit" data-i18n="search_button"></button>
      </form>
    </details>
    <span id="pdf-slot"></span>
  </div>
  <h1 id="doc-title" class="doc-title"></h1>
  <p class="hit-meta" id="doc-meta"></p>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <!-- The frame holds the page still while the page itself scrolls inside it when
       zoomed, which is what lets the highlight toggle sit over a corner of the
       document and stay there. -->
  <div class="page-frame" id="page-frame">
    <!-- Everything that acts on the page itself, behind one kebab over its top-right
         corner: one small control on the page rather than a row of them covering
         its words. A <details>, like the PDF menu in the bar, so it opens without
         script, closes on Escape and on a click elsewhere (i18n.js: closeMenus).
         The items have no data-i18n: viewer.js writes each label, which names the
         action the current state makes available ("hide" while it is showing).
         FIRST in the frame, because it is sticky (app.css): it rides down with the
         reader to the top-right of the visible part of the page, and a sticky box
         travels only from where it sits in the flow. -->
    <details class="page-menu" id="page-menu">
      <summary class="plain overlay" data-i18n-attr="aria-label:page_menu,title:page_menu">⋮</summary>
      <div class="page-menu-items">
        <button class="plain" id="hl-btn" aria-pressed="true"></button>
        <button class="plain" id="text-btn" aria-pressed="false"></button>
        <button class="plain" id="copy-btn"></button>
        <button class="plain" id="full-btn"></button>
      </div>
    </details>
    <div class="page-scroll" id="scroll">
      <!-- The canvas, the highlight layer and the text layer share this positioned
           box, so a box in PDF points can be placed as a percentage of it and stay
           correct at any zoom or window width. The text layer is last, and so on
           top: it is what the reader's cursor has to reach to select text, and the
           highlight boxes under it are pointer-events: none for the same reason. -->
      <div class="page-stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="hit-layer" id="layer"></div>
        <div class="text-layer" id="textlayer"></div>
      </div>
    </div>
    <!-- The page as text: pdf.js's own text of the page, with the passage marked
         (src/pagetext.js). Shown INSTEAD of the image in "read as text" mode, for a
         page too faint or too small to read and for copying more than a selection
         over the canvas allows. -->
    <div class="page-text" id="pagetext" hidden></div>
  </div>
  <!-- The pager sits under the page, where the reader's eyes already are when they
       reach the end of it, and where "next page" means what it says. Above the page
       it asked for a decision before the page had been read. One group, so a narrow
       screen wraps it as a unit: split across two lines, "Page précédente" ends up
       above the number it belongs to and reads as two unrelated controls. -->
  <p class="pager">
    <button class="plain" id="prev" data-i18n="prev_page"></button>
    <span id="pageno"></span>
    <button class="plain" id="next" data-i18n="next_page"></button>
  </p>
</main>

<!-- Same footer as the search page, filled by site.js. -->
<footer class="bot" id="foot"></footer>

<script type="module" src="viewer.js"></script>
</body>
</html>
